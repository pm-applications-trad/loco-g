name: locogames
description: LocoGames - Premium 18+ Party Game Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  get_it: ^8.0.3

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.2

  # Local Storage
  shared_preferences: ^2.3.5
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # UI & Animations
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1

  # Haptics & Sound
  vibration: ^2.0.1
  audioplayers: ^6.1.0

  # Ads & Monetization
  google_mobile_ads: ^5.2.0
  in_app_purchase: ^3.2.1
  purchases_flutter: ^8.4.0

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0
  uuid: ^4.5.1
  logger: ^2.5.0
  equatable: ^2.0.7
  connectivity_plus: ^6.1.2

  # Platform
  package_info_plus: ^8.2.1
  device_info_plus: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.2
  mockito: ^5.4.5
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/sounds/
    - assets/l10n/

